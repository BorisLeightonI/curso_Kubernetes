apiVersion: v1
kind: Namespace
metadata:
  name: desarrollo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  # namespace: desarrollo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  # namespace: desarrollo
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - targetPort: 80
      port: 80
      nodePort: 30007
