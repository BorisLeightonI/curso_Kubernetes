apiVersion: v1
kind: Pod
metadata:
  name: "nginx-always-failed"
  namespace: default
  labels:
    app: "nginx-always-failed"
spec:
  restartPolicy: OnFailure
  containers:
    - name: nginx-always-failed
      image: "nginx:latest"
      command: ["sh", "-c", "echo Ejemplo de pod fallando && exit 1"]
      ports:
        - containerPort: 80
          name: http
